name: Telegram website request

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Website change requested in Telegram"
        required: true
        type: string
      telegram_chat_id:
        description: "Private Telegram chat ID for completion notification"
        required: true
        type: string
      telegram_user_id:
        description: "Telegram user ID that submitted the request"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-site-editor
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.agent.outputs.changed }}
      final_message: ${{ steps.agent.outputs.final_message }}
      usage_summary: ${{ steps.agent.outputs.usage_summary }}
    steps:
      - name: Checkout repository without a persisted GitHub token
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python agent syntax
        run: python -c "from pathlib import Path; compile(Path('agent/telegram_site_agent.py').read_text(encoding='utf-8'), 'agent/telegram_site_agent.py', 'exec')"

      - name: Run REG.RU Cloud website agent
        id: agent
        env:
          REGCLOUD_API_KEY: ${{ secrets.REGCLOUD_API_KEY }}
          TASK: ${{ inputs.task }}
          TELEGRAM_USER_ID: ${{ inputs.telegram_user_id }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python agent/telegram_site_agent.py

      - name: Report validation stage
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.telegram_chat_id }}
          AGENT_RESULT: ${{ steps.agent.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AGENT_RESULT" == "success" ]]; then
            TEXT="🔍 Агент завершил подготовку изменений. Проверяю JavaScript, PHP и целостность патча."
          else
            TEXT="⚠️ Агент не смог подготовить изменения. Собираю отчёт об ошибке."
          fi
          jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" '{chat_id:$chat_id,text:$text}' |
            curl --fail-with-body --silent --show-error "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" --data-binary @-

      - name: Validate changed files and JavaScript syntax
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git status --short --untracked-files=all | sed -E 's/^...//')
          for file in "${changed_files[@]}"; do
            [[ "$file" == "index.html" || "$file" == "api.php" ]] || {
              echo "Agent modified a protected or unsupported file: $file"
              exit 1
            }
          done

          if ! git diff --quiet -- index.html api.php; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Agent made no application changes."
            exit 0
          fi

          git diff --check
          php -l api.php
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          let count = 0;
          for (const match of scripts) {
            const source = match[1].trim();
            if (!source) continue;
            new vm.Script(source, { filename: 'inline-script-' + (++count) + '.js' });
          }
          console.log('Validated ' + count + ' inline JavaScript block(s).');
          NODE

      - name: Upload validated website file
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-site-update
          path: |
            index.html
            api.php
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: edit
    if: needs.edit.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated website file
        uses: actions/download-artifact@v4
        with:
          name: telegram-site-update
          path: ./telegram-artifact

      - name: Replace file, commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 telegram-artifact/index.html ./index.html
          install -m 0644 telegram-artifact/api.php ./api.php
          git diff --check
          git diff --quiet -- index.html api.php && { echo "No changes to commit."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html api.php
          git commit -m "Update website from Telegram request"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
          TEXT="📦 Изменения сохранены в GitHub. Начинаю публикацию сайта на REG.RU."
          jq -n --arg chat_id "${{ inputs.telegram_chat_id }}" --arg text "$TEXT" '{chat_id:$chat_id,text:$text}' |
            curl --fail-with-body --silent --show-error "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -H "Content-Type: application/json" --data-binary @-

  deploy:
    needs: [edit, commit]
    if: needs.edit.outputs.changed == 'true' && needs.commit.result == 'success'
    uses: ./.github/workflows/deploy-reg-ru.yml
    with:
      remote_path: "www/zevnull.ru"
    secrets: inherit

  notify:
    needs: [edit, commit, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send result to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GATEWAY_URL: ${{ secrets.TELEGRAM_GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.TELEGRAM_GATEWAY_SECRET }}
          CHAT_ID: ${{ inputs.telegram_chat_id }}
          EDIT_RESULT: ${{ needs.edit.result }}
          EDIT_CHANGED: ${{ needs.edit.outputs.changed }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          AGENT_MESSAGE: ${{ needs.edit.outputs.final_message }}
          USAGE_SUMMARY: ${{ needs.edit.outputs.usage_summary }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EDIT_RESULT" != "success" ]]; then
            TEXT="Не удалось обработать задачу. Открой GitHub Actions и посмотри журнал запуска. Этап ИИ-агента: $EDIT_RESULT."
          elif [[ "$EDIT_CHANGED" != "true" ]]; then
            TEXT="Агент не внёс изменений. Возможно, сайт уже соответствует запросу или задаче требуется уточнение."
          elif [[ "$COMMIT_RESULT" != "success" ]]; then
            TEXT="Изменение прошло проверку, но не удалось отправить его в GitHub. Публикации не было."
          elif [[ "$DEPLOY_RESULT" == "success" ]]; then
            TEXT="Готово! Изменения проверены, отправлены в GitHub и опубликованы на https://zevnull.ru/."
          else
            TEXT="Изменения отправлены в GitHub, но публикация на REG.RU завершилась ошибкой. Сайт мог остаться на предыдущей версии. Проверь GitHub Actions."
          fi

          if [[ -n "${AGENT_MESSAGE:-}" ]]; then
            SUMMARY="${AGENT_MESSAGE:0:1500}"
            TEXT="$TEXT

          Отчёт агента:
          $SUMMARY"
          fi

          if [[ -n "${USAGE_SUMMARY:-}" ]]; then
            TEXT="$TEXT

          Токены по данным API:
          $USAGE_SUMMARY"
          fi

          jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' > request.json
          if [[ -n "${GATEWAY_URL:-}" && -n "${GATEWAY_SECRET:-}" ]]; then
            echo "Sending Telegram notification through Cloudflare Gateway."
            if ! curl --fail-with-body --silent --show-error \
              "${GATEWAY_URL%/}/notify" \
              -H "Content-Type: application/json" \
              -H "X-Gateway-Secret: ${GATEWAY_SECRET}" \
              --data-binary @request.json; then
              echo "::warning::Cloudflare Gateway notification failed; trying direct Telegram API fallback."
              curl --fail-with-body --silent --show-error \
                "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                --data-binary @request.json
            fi
          else
            echo "Cloudflare Gateway not configured; using current direct Telegram route."
            curl --fail-with-body --silent --show-error \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              --data-binary @request.json
          fi
