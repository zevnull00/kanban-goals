name: Deploy to REG.RU

on:
  workflow_dispatch:
    inputs:
      remote_path:
        description: "Absolute SFTP path to the target directory (use a staging directory first)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reg-ru-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload index.html and api.php over SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration and target path
        shell: bash
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
          REG_SFTP_HOST: ${{ secrets.REG_SFTP_HOST }}
          REG_SFTP_PORT: ${{ secrets.REG_SFTP_PORT }}
          REG_SFTP_USER: ${{ secrets.REG_SFTP_USER }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${REG_SFTP_HOST:?Missing REG_SFTP_HOST secret}"
          : "${REG_SFTP_PORT:?Missing REG_SFTP_PORT secret}"
          : "${REG_SFTP_USER:?Missing REG_SFTP_USER secret}"
          : "${REG_SFTP_PASSWORD:?Missing REG_SFTP_PASSWORD secret}"
          [[ "$REG_SFTP_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid SFTP port"; exit 1; }
          [[ "$REMOTE_PATH" == /* ]] || { echo "remote_path must be an absolute SFTP path"; exit 1; }
          [[ "$REMOTE_PATH" != "/" ]] || { echo "Refusing to deploy to filesystem root"; exit 1; }
          [[ "$REMOTE_PATH" != *".."* && "$REMOTE_PATH" != *" "* ]] || { echo "Path must not contain '..' or spaces"; exit 1; }
          [[ "$REMOTE_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "Path contains unsupported characters"; exit 1; }
          test -s index.html || { echo "index.html is missing or empty"; exit 1; }
          test -s api.php || { echo "api.php is missing or empty"; exit 1; }

      - name: Install OpenSSH client and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      - name: Upload application files to temporary remote names
        shell: bash
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
          REG_SFTP_HOST: ${{ secrets.REG_SFTP_HOST }}
          REG_SFTP_PORT: ${{ secrets.REG_SFTP_PORT }}
          REG_SFTP_USER: ${{ secrets.REG_SFTP_USER }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          {
            printf 'put index.html "%s/.index.html.uploading"\n' "$REMOTE_PATH"
            printf 'put api.php "%s/.api.php.uploading"\n' "$REMOTE_PATH"
          } > "$RUNNER_TEMP/upload.batch"
          export SSHPASS="$REG_SFTP_PASSWORD"
          sshpass -e sftp -q -P "$REG_SFTP_PORT" \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -oGlobalKnownHostsFile=/dev/null \
            -b "$RUNNER_TEMP/upload.batch" \
            "$REG_SFTP_USER@$REG_SFTP_HOST"

      - name: Back up current files and activate uploaded files
        id: activate
        shell: bash
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
          REG_SFTP_HOST: ${{ secrets.REG_SFTP_HOST }}
          REG_SFTP_PORT: ${{ secrets.REG_SFTP_PORT }}
          REG_SFTP_USER: ${{ secrets.REG_SFTP_USER }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          INDEX_BACKUP="index.html.backup.${GITHUB_RUN_ID}"
          API_BACKUP="api.php.backup.${GITHUB_RUN_ID}"
          {
            printf -- '-rename "%s/index.html" "%s/%s"\n' "$REMOTE_PATH" "$REMOTE_PATH" "$INDEX_BACKUP"
            printf -- '-rename "%s/api.php" "%s/%s"\n' "$REMOTE_PATH" "$REMOTE_PATH" "$API_BACKUP"
            printf 'rename "%s/.index.html.uploading" "%s/index.html"\n' "$REMOTE_PATH" "$REMOTE_PATH"
            printf 'rename "%s/.api.php.uploading" "%s/api.php"\n' "$REMOTE_PATH" "$REMOTE_PATH"
          } > "$RUNNER_TEMP/activate.batch"
          export SSHPASS="$REG_SFTP_PASSWORD"
          sshpass -e sftp -q -P "$REG_SFTP_PORT" \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -oGlobalKnownHostsFile=/dev/null \
            -b "$RUNNER_TEMP/activate.batch" \
            "$REG_SFTP_USER@$REG_SFTP_HOST"

      - name: Restore previous files if activation failed
        if: failure() && steps.activate.outcome == 'failure'
        shell: bash
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
          REG_SFTP_HOST: ${{ secrets.REG_SFTP_HOST }}
          REG_SFTP_PORT: ${{ secrets.REG_SFTP_PORT }}
          REG_SFTP_USER: ${{ secrets.REG_SFTP_USER }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          INDEX_BACKUP="index.html.backup.${GITHUB_RUN_ID}"
          API_BACKUP="api.php.backup.${GITHUB_RUN_ID}"
          {
            printf -- '-rename "%s/%s" "%s/index.html"\n' "$REMOTE_PATH" "$INDEX_BACKUP" "$REMOTE_PATH"
            printf -- '-rename "%s/%s" "%s/api.php"\n' "$REMOTE_PATH" "$API_BACKUP" "$REMOTE_PATH"
          } > "$RUNNER_TEMP/rollback.batch"
          export SSHPASS="$REG_SFTP_PASSWORD"
          sshpass -e sftp -q -P "$REG_SFTP_PORT" \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -oGlobalKnownHostsFile=/dev/null \
            -b "$RUNNER_TEMP/rollback.batch" \
            "$REG_SFTP_USER@$REG_SFTP_HOST"
